name: Notify Discord on Release
on:
  release:
    types: [published]

jobs:
  discord_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Information to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          # Fallback values for empty variables
          TITLE_TEXT="New Release: ${RELEASE_NAME:-$RELEASE_TAG}"
          BODY_TEXT="${RELEASE_BODY:-No release notes provided.}"
          URL_TEXT="${RELEASE_URL:-https://github.com}"

          # Construct JSON: jq truncates body to max 2000 chars and enforces non-empty strings
          PAYLOAD=$(jq -n \
            --arg title "$TITLE_TEXT" \
            --arg url "$URL_TEXT" \
            --arg desc "$BODY_TEXT" \
            '{
              embeds: [{
                title: (if $title == "" then "New Release" else $title end),
                url: $url,
                description: ($desc | .[0:2000]),
                color: 5814783,
                footer: { text: "Cephalon Kronos Update" }
              }]
            }')

          # Send payload
          curl --fail -sS -X POST \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK"