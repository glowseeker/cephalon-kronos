name: Notify Discord on Release
on:
  release:
    types: [published]

jobs:
  discord_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Information to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          # Safe fallback for title using bash syntax
          TITLE_TEXT="New Release: ${RELEASE_NAME:-$RELEASE_TAG}"

          # Construct JSON using ENV variables inside jq instead of inline bash interpolation
          PAYLOAD=$(jq -n \
            --arg title "$TITLE_TEXT" \
            --arg url "$RELEASE_URL" \
            --arg desc "$RELEASE_BODY" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5814783,
                footer: { text: "Cephalon Kronos Update" }
              }]
            }')

          # Send payload and force curl to fail the step if Discord rejects it (e.g., HTTP 400/401/403)
          curl -fail -sS -X POST \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK"