[package]
name = "cephalon-kronos"
version = "0.8.0"
description = "A cross-platform desktop companion for Warframe"
authors = ["glowseeker"]
license = ""
repository = ""
edition = "2021"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.1"

[dependencies]
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.1"
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
webkit2gtk-nvidia-quirk = { version = "1.3" }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
url = "2.5"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
xz2 = "0.1"

xcap = "0.4"
levenshtein = "1.0"
image = "0.25"
imageproc = "0.25"
chrono = "0.4"
ocr-rs = "2.2"
active-win-pos-rs = "0.10.1"

# tract: pure-Rust ONNX inference, replaces ort.
# No prebuilt C++ runtime means no CRT mismatch with ocr-rs on Windows,
# no glibc version requirement on Linux, and no load-dynamic hang on any platform.
tract-onnx = "0.21"
send_wrapper = "0.6"


[patch.crates-io]
alloc-no-stdlib = { git = "https://github.com/dropbox/rust-alloc-no-stdlib.git", rev = "6032b6a9b20e03737135c55a0270ccffcc1438ef" }
alloc-stdlib = { git = "https://github.com/dropbox/rust-alloc-no-stdlib.git", rev = "6032b6a9b20e03737135c55a0270ccffcc1438ef" }
brotli-decompressor = { git = "https://github.com/dropbox/rust-brotli-decompressor.git", tag = "5.0.1", version = "=5.0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
glib = "0.18"
libc = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"


[[bin]]
name = "cephalon-kronos"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2.7"

[features]
dev = []
devtools = []
